[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Financial data research and quantitative backtesting platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jirath Thanabarameth" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "httpx>=0.27",
    "tabulate>=0.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
airflow = ["apache-airflow>=2.9,<3.0"]
boost = ["xgboost>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-python-dateutil",
]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantlab = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, no external dependencies",
    "integration: needs a live PostgreSQL database",
    "leakage: look-ahead / data-leakage regression tests",
    "network: needs outbound internet access (skipped by default in CI)",
    "slow: takes more than a couple of seconds",
]
filterwarnings = [
    "error::DeprecationWarning:quantlab.*",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["migrations/versions", ".qlvenv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "ARG",       # unused arguments
    "PTH",       # pathlib
    "TID",       # tidy imports
    "PD",        # pandas-vet
    "NPY",       # numpy
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in a default argument is the documented idiom
    "RUF012",  # ClassVar on SQLAlchemy declarative attributes is noise
    "RUF046",  # int(round(...)) is clearer than relying on round's return type
    "RUF009",  # dataclass defaults built by a factory are deliberate here
    "PD010",   # pivot/pivot_table is the right tool for long-to-wide feature frames
    "PD011",   # .values on a numpy-backed Series is intentional in hot paths
    "B027",    # optional hooks on abstract providers are meant to be no-ops
    "SIM108",  # a ternary is not always more readable than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PD901", "PLR2004"]
"dags/**" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
# CI runs mypy on Python 3.12. Runtime compatibility with 3.10 is covered by
# the separate Python 3.10 test job.
python_version = "3.12"
files = ["src/quantlab"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
plugins = []

# pandas ships no type information, and `pandas-stubs` is a third-party
# approximation that disagrees with pandas often enough to generate more noise
# than signal on a codebase this pandas-heavy.  The project's own types are
# checked; pandas is treated as untyped at the boundary.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "statsmodels.*",
    "sklearn.*",
    "scipy.*",
    "plotly.*",
    "streamlit.*",
    "xgboost.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/quantlab"]
omit = ["*/dashboard/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
